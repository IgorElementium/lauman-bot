  #   image: openai/whisper:latest
  #   environment:
  #     WHISPER_MODEL: ${WHISPER_MODEL:-small}
  #   ports:
  #     - "5000:5000"
  #   networks:
  #     - lauman-bot

networks:
  lauman-bot:
    driver: bridge
