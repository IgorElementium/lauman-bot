version: '3.8'

services:
  bot:
    build: .
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    restart: unless-stopped
    networks:
      - lauman-bot

  # TODO: Phase 5 - add whisper sidecar for voice transcription
